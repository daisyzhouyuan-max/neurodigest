<svg xmlns="http://www.w3.org/2000/svg" width="570" height="312" viewBox="0 0 570 312" role="img"><title>Trait-linked circuit resilience offsets tau-induced cellular vulnerability in AD</title><desc>Resilience is an active circuit state, not just less pathology</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="570" height="312" fill="#ffffff"/><text x="16" y="24" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#14171a" text-anchor="start">Trait-linked circuit resilience offsets tau-induced cellular vulnerability in AD</text><text x="16" y="42" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8a939c" text-anchor="start">3xTg-AD mice cross-referenced to human AD</text><rect x="16.0" y="58" width="255.0" height="78" rx="5" fill="#FAEEEA" stroke="#DFA792" stroke-width="1"/><text x="29.0" y="87.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#7E3418" text-anchor="start">Tau in Edinger-Westphal</text><text x="29.0" y="102.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#7E3418" text-anchor="start">CART+ neurons hypoexcitable</text><text x="29.0" y="116.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#7E3418" text-anchor="start">via Kcnma1 upregulation</text><rect x="299.0" y="58" width="255.0" height="78" rx="5" fill="#E5F4EF" stroke="#86C6AE" stroke-width="1"/><text x="312.0" y="87.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0D5843" text-anchor="start">mPB to EW compensation</text><text x="312.0" y="102.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#0D5843" text-anchor="start">Substance P-Tacr1 signaling</text><text x="312.0" y="116.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#0D5843" text-anchor="start">sustains CART+ function</text><line x1="271.0" y1="97.0" x2="299.0" y2="97.0" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><rect x="16.0" y="164" width="538.0" height="78" rx="5" fill="#EDF4E3" stroke="#9CBE74" stroke-width="1"/><text x="285.0" y="193.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#31570F" text-anchor="middle">Resilience delays decline</text><text x="285.0" y="208.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#31570F" text-anchor="middle">Vulnerability predicts future decline</text><text x="285.0" y="222.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#31570F" text-anchor="middle">Circuit plasticity protects cognition</text><line x1="143.5" y1="136" x2="235.0" y2="164" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><line x1="426.5" y1="136" x2="335.0" y2="164" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><rect x="16" y="262" width="538" height="34" rx="5" fill="#E5F4EF" stroke="#86C6AE" stroke-width="1"/><text x="285.0" y="284" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0D5843" text-anchor="middle">Resilience is an active circuit state, not just less pathology</text></svg>