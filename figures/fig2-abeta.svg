<svg xmlns="http://www.w3.org/2000/svg" width="570" height="336" viewBox="0 0 570 336" role="img"><title>Receptor-bound amyloid-beta filament structure</title><desc>Receptor-bound amyloid-beta eluted from AD brain forms 65 nm filaments ten times more abundant than free amyloid-beta, resembling plaque filaments but distinguishable by subunit tilt, N-terminal conformation, length and seeding.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="570" height="336" fill="#ffffff"/><text x="16" y="24" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#14171a" text-anchor="start">Receptor-bound amyloid-β is a filament, not a separate oligomer</text><rect x="16" y="40" width="150" height="44" rx="5" fill="#F1F2F1" stroke="#BFC2C0" stroke-width="1"/><text x="29" y="59.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#3B3E3D" text-anchor="start">AD brain tissue</text><text x="29" y="74.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#3B3E3D" text-anchor="start">Post-mortem</text><rect x="188" y="40" width="210" height="44" rx="5" fill="#E9F1FA" stroke="#7FA8CE" stroke-width="1"/><text x="201" y="59.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#123C63" text-anchor="start">PrP-antagonist elution</text><text x="201" y="74.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#123C63" text-anchor="start">Releases receptor-bound pool</text><rect x="420" y="40" width="134" height="44" rx="5" fill="#E9F1FA" stroke="#7FA8CE" stroke-width="1"/><text x="433" y="59.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#123C63" text-anchor="start">Cryo-EM</text><text x="433" y="74.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#123C63" text-anchor="start">To homogeneity</text><line x1="170" y1="62" x2="184" y2="62" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><line x1="402" y1="62" x2="416" y2="62" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><rect x="16" y="100" width="538" height="132" rx="7" fill="none" stroke="#d9dde0" stroke-width="1" stroke-dasharray="4 4"/><text x="29" y="117" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#8a939c" text-anchor="start">TWO POOLS FROM THE SAME BRAIN, COMPARED</text><rect x="30" y="120" width="244" height="96" rx="5" fill="#FAEEEA" stroke="#DFA792" stroke-width="1"/><text x="43" y="151.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#7E3418" text-anchor="start">Receptor-bound Aβ</text><text x="43" y="166.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#7E3418" text-anchor="start">65 nm filaments; ~10× more</text><text x="43" y="180.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#7E3418" text-anchor="start">abundant than free Aβ</text><text x="43" y="194.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#7E3418" text-anchor="start">Two S-shaped monomers per rung</text><rect x="296" y="120" width="248" height="96" rx="5" fill="#F1F2F1" stroke="#BFC2C0" stroke-width="1"/><text x="309" y="151.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#3B3E3D" text-anchor="start">Plaque filaments</text><text x="309" y="166.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#3B3E3D" text-anchor="start">Same overall fold, but differ in</text><text x="309" y="180.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#3B3E3D" text-anchor="start">subunit tilt, N-terminal shape,</text><text x="309" y="194.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#3B3E3D" text-anchor="start">length and seeding</text><line x1="285" y1="132" x2="285" y2="204" stroke="#d9dde0" stroke-width="1" stroke-dasharray="3 3"/><rect x="16" y="244" width="538" height="42" rx="5" fill="#FBF1DF" stroke="#DFBA7C" stroke-width="1"/><text x="285.0" y="269.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#6E4309" text-anchor="middle">Filament tips bind PrP and drive synapse loss in human neurons</text><rect x="16" y="294" width="538" height="34" rx="5" fill="#E5F4EF" stroke="#86C6AE" stroke-width="1"/><text x="285.0" y="316" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0D5843" text-anchor="middle">Synaptotoxicity tracks short filament ends, not a distinct oligomer</text></svg>