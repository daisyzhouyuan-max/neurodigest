<svg xmlns="http://www.w3.org/2000/svg" width="570" height="312" viewBox="0 0 570 312" role="img"><title>Microglia-to-neuron iron transfer drives PD</title><desc>Microglia-to-neuron iron transfer drives dopaminergic ferroptosis in PD</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="570" height="312" fill="#ffffff"/><text x="16" y="24" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#14171a" text-anchor="start">Microglia-to-neuron iron transfer drives PD</text><text x="16" y="42" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8a939c" text-anchor="start">Nat Neurosci | mouse &amp; human microglia, in vivo</text><rect x="16.0" y="58" width="255.0" height="78" rx="5" fill="#E9F1FA" stroke="#7FA8CE" stroke-width="1"/><text x="29.0" y="87.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#123C63" text-anchor="start">Microglial NgBR loss</text><text x="29.0" y="102.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#123C63" text-anchor="start">ER stress → PERK-ATF4-</text><text x="29.0" y="116.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#123C63" text-anchor="start">NUPR1; LCN2 iron efflux</text><rect x="299.0" y="58" width="255.0" height="78" rx="5" fill="#FBF1DF" stroke="#DFBA7C" stroke-width="1"/><text x="312.0" y="87.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#6E4309" text-anchor="start">Holo-LCN2 → SLC22A17</text><text x="312.0" y="102.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6E4309" text-anchor="start">Iron-loaded LCN2 taken</text><text x="312.0" y="116.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6E4309" text-anchor="start">up by DA neurons</text><line x1="271.0" y1="97.0" x2="299.0" y2="97.0" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><rect x="16.0" y="164" width="538.0" height="78" rx="5" fill="#FAEEEA" stroke="#DFA792" stroke-width="1"/><text x="285.0" y="193.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#7E3418" text-anchor="middle">Iron overload → ferroptosis</text><text x="285.0" y="208.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#7E3418" text-anchor="middle">DA neuron loss, PD motor deficits;</text><text x="285.0" y="222.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#7E3418" text-anchor="middle">blocking axis is protective</text><line x1="143.5" y1="136" x2="235.0" y2="164" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><line x1="426.5" y1="136" x2="335.0" y2="164" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><rect x="16" y="262" width="538" height="34" rx="5" fill="#E5F4EF" stroke="#86C6AE" stroke-width="1"/><text x="285.0" y="284" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0D5843" text-anchor="middle">Microglia-to-neuron iron transfer drives dopaminergic ferroptosis in PD</text></svg>