<svg xmlns="http://www.w3.org/2000/svg" width="570" height="330" viewBox="0 0 570 330" role="img"><title>APOE-guided lecanemab dosing and ARIA</title><desc>Under genotype-guided dosing, ARIA-E tracked APOE e4 dose with a shallower gradient than historical cohorts, while ARIA-H tracked pre-existing cerebrovascular burden.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="570" height="330" fill="#ffffff"/><text x="16" y="24" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#14171a" text-anchor="start">APOE-guided lecanemab dosing separates two ARIA axes</text><text x="16" y="42" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8a939c" text-anchor="start">508 patients, eight Korean centres, MRI surveillance</text><rect x="160" y="58" width="250" height="44" rx="5" fill="#E9F1FA" stroke="#7FA8CE" stroke-width="1"/><text x="285.0" y="77.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#123C63" text-anchor="middle">APOE-guided dose escalation</text><text x="285.0" y="92.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#123C63" text-anchor="middle">Cmax target set by ε4 dose</text><line x1="230" y1="104" x2="150" y2="126" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><line x1="340" y1="104" x2="420" y2="126" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><rect x="16" y="130" width="262" height="96" rx="5" fill="#E5F4EF" stroke="#86C6AE" stroke-width="1"/><text x="29" y="161.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0D5843" text-anchor="start">ARIA-E  (oedema)</text><text x="29" y="176.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#0D5843" text-anchor="start">Driven by APOE ε4 dose</text><text x="29" y="190.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#0D5843" text-anchor="start">ε4/ε4 vs non-carrier OR 3.25</text><text x="29" y="204.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#0D5843" text-anchor="start">vs 8.49 and 8.32 historically</text><rect x="292" y="130" width="262" height="96" rx="5" fill="#FAEEEA" stroke="#DFA792" stroke-width="1"/><text x="305" y="161.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#7E3418" text-anchor="start">ARIA-H  (haemosiderin)</text><text x="305" y="176.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#7E3418" text-anchor="start">Driven by baseline vessel burden:</text><text x="305" y="190.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#7E3418" text-anchor="start">microbleeds, WMH, age, ε4 dose</text><text x="305" y="204.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#7E3418" text-anchor="start">Not attenuated by dosing</text><rect x="16" y="240" width="538" height="46" rx="5" fill="#F1F2F1" stroke="#BFC2C0" stroke-width="1"/><text x="285.0" y="260.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#3B3E3D" text-anchor="middle">Non-randomised comparison with historical cohorts</text><text x="285.0" y="275.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#3B3E3D" text-anchor="middle">Compatible with, but not proof of, attenuation</text><rect x="16" y="296" width="538" height="34" rx="5" fill="#E5F4EF" stroke="#86C6AE" stroke-width="1"/><text x="285.0" y="318" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0D5843" text-anchor="middle">A dual-axis safety model that still needs a randomised test</text></svg>