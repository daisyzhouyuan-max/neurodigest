<svg xmlns="http://www.w3.org/2000/svg" width="570" height="322" viewBox="0 0 570 322" role="img"><title>Neuronal population organization in a macaque Alzheimer model</title><desc>Across levels, molecular pathology and single-neuron tuning are spared while population coordination and behaviour degrade, indicating a selective loss of coordination.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="570" height="322" fill="#ffffff"/><text x="16" y="24" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#14171a" text-anchor="start">Early Alzheimer pathology disrupts coordination, not tuning</text><text x="16" y="42" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8a939c" text-anchor="start">Macaque model, longitudinal recordings (n = 2 animals)</text><rect x="16" y="58" width="400" height="46" rx="5" fill="#FBF1DF" stroke="#DFBA7C" stroke-width="1"/><text x="29" y="78.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#6E4309" text-anchor="start">Molecular pathology</text><text x="29" y="93.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6E4309" text-anchor="start">Confined to regions giving feedback to visual cortex</text><rect x="432" y="70" width="122" height="22" rx="11" fill="#FBF1DF" stroke="#DFBA7C" stroke-width="1"/><text x="493" y="85" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#6E4309" text-anchor="middle">AFFECTED</text><line x1="216" y1="104" x2="216" y2="112" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><rect x="16" y="114" width="400" height="46" rx="5" fill="#EDF4E3" stroke="#9CBE74" stroke-width="1"/><text x="29" y="134.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#31570F" text-anchor="start">Single-neuron tuning</text><text x="29" y="149.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#31570F" text-anchor="start">Feature encoding and tuning remain stable</text><rect x="432" y="126" width="122" height="22" rx="11" fill="#EDF4E3" stroke="#9CBE74" stroke-width="1"/><text x="493" y="141" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#31570F" text-anchor="middle">PRESERVED</text><line x1="216" y1="160" x2="216" y2="168" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><rect x="16" y="170" width="400" height="46" rx="5" fill="#FAEEEA" stroke="#DFA792" stroke-width="1"/><text x="29" y="190.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#7E3418" text-anchor="start">Population coordination</text><text x="29" y="205.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#7E3418" text-anchor="start">Declines within and between visual and parietal cortex</text><rect x="432" y="182" width="122" height="22" rx="11" fill="#FAEEEA" stroke="#DFA792" stroke-width="1"/><text x="493" y="197" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#7E3418" text-anchor="middle">DISRUPTED</text><line x1="216" y1="216" x2="216" y2="224" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><rect x="16" y="226" width="400" height="46" rx="5" fill="#FAEEEA" stroke="#DFA792" stroke-width="1"/><text x="29" y="246.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#7E3418" text-anchor="start">Visually guided behaviour</text><text x="29" y="261.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#7E3418" text-anchor="start">Less consistent, more variable exploration</text><rect x="432" y="238" width="122" height="22" rx="11" fill="#FAEEEA" stroke="#DFA792" stroke-width="1"/><text x="493" y="253" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#7E3418" text-anchor="middle">DISRUPTED</text><rect x="16" y="282" width="538" height="34" rx="5" fill="#E5F4EF" stroke="#86C6AE" stroke-width="1"/><text x="285.0" y="304" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0D5843" text-anchor="middle">Methylphenidate transiently restored behavioural organisation</text></svg>