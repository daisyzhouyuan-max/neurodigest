<svg xmlns="http://www.w3.org/2000/svg" width="570" height="312" viewBox="0 0 570 312" role="img"><title>RIPK1 inhibitor fails to slow ALS</title><desc>Selective RIPK1 inhibition did not slow functional decline in ALS</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="570" height="312" fill="#ffffff"/><text x="16" y="24" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#14171a" text-anchor="start">RIPK1 inhibitor fails to slow ALS</text><text x="16" y="42" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8a939c" text-anchor="start">Phase 2 RCT, n=305, 24 weeks</text><rect x="16.0" y="58" width="255.0" height="78" rx="5" fill="#E9F1FA" stroke="#7FA8CE" stroke-width="1"/><text x="29.0" y="87.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#123C63" text-anchor="start">SAR443820 vs placebo</text><text x="29.0" y="102.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#123C63" text-anchor="start">Oral CNS-penetrant</text><text x="29.0" y="116.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#123C63" text-anchor="start">RIPK1 inhibitor, 2:1</text><rect x="299.0" y="58" width="255.0" height="78" rx="5" fill="#F1F2F1" stroke="#BFC2C0" stroke-width="1"/><text x="312.0" y="87.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#3B3E3D" text-anchor="start">No ALSFRS-R benefit</text><text x="312.0" y="102.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#3B3E3D" text-anchor="start">Delta -0.41 points</text><text x="312.0" y="116.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#3B3E3D" text-anchor="start">(CI -1.71 to 0.88)</text><line x1="271.0" y1="97.0" x2="299.0" y2="97.0" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><rect x="16.0" y="164" width="538.0" height="78" rx="5" fill="#FAEEEA" stroke="#DFA792" stroke-width="1"/><text x="285.0" y="200.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#7E3418" text-anchor="middle">More hepatic enzyme elevation</text><text x="285.0" y="215.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#7E3418" text-anchor="middle">Higher adverse events and discontinuation; development halted</text><line x1="143.5" y1="136" x2="235.0" y2="164" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><line x1="426.5" y1="136" x2="335.0" y2="164" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><rect x="16" y="262" width="538" height="34" rx="5" fill="#E5F4EF" stroke="#86C6AE" stroke-width="1"/><text x="285.0" y="284" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0D5843" text-anchor="middle">Selective RIPK1 inhibition did not slow functional decline in ALS</text></svg>