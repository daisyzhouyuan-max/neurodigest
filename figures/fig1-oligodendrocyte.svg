<svg xmlns="http://www.w3.org/2000/svg" width="570" height="330" viewBox="0 0 570 330" role="img"><title>Oligodendrocyte NRF2 and cognitive aging</title><desc>Human white matter associates NRF2 loss and altered myelin with faster cognitive decline; oligodendrocyte-specific Nrf2 knockout in aged mice reproduces the pathology.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="570" height="330" fill="#ffffff"/><text x="16" y="24" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#14171a" text-anchor="start">Oligodendrocyte NRF2 and the rate of cognitive aging</text><rect x="16" y="38" width="538" height="128" rx="7" fill="none" stroke="#d9dde0" stroke-width="1" stroke-dasharray="4 4"/><text x="29" y="55" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#8a939c" text-anchor="start">HUMAN — POST-MORTEM WHITE MATTER (ASSOCIATION)</text><rect x="30" y="58" width="232" height="44" rx="5" fill="#E9F1FA" stroke="#7FA8CE" stroke-width="1"/><text x="43" y="77.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#123C63" text-anchor="start">NRF2 downregulated</text><text x="43" y="92.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#123C63" text-anchor="start">In oligodendrocytes</text><rect x="30" y="110" width="232" height="44" rx="5" fill="#E9F1FA" stroke="#7FA8CE" stroke-width="1"/><text x="43" y="129.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#123C63" text-anchor="start">Altered myelin structure</text><text x="43" y="144.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#123C63" text-anchor="start">Thicker sheaths, smaller axons</text><rect x="320" y="84" width="224" height="44" rx="5" fill="#F1F2F1" stroke="#BFC2C0" stroke-width="1"/><text x="333" y="103.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#3B3E3D" text-anchor="start">Worse cognitive trajectory</text><text x="333" y="118.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#3B3E3D" text-anchor="start">Individual rate of decline</text><line x1="266" y1="80" x2="314" y2="100" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><line x1="266" y1="132" x2="314" y2="112" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><rect x="16" y="178" width="538" height="92" rx="7" fill="none" stroke="#d9dde0" stroke-width="1" stroke-dasharray="4 4"/><text x="29" y="195" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#8a939c" text-anchor="start">MOUSE — OLIGODENDROCYTE-SPECIFIC Nrf2 KNOCKOUT (CAUSAL TEST)</text><rect x="30" y="198" width="232" height="48" rx="5" fill="#EDF4E3" stroke="#9CBE74" stroke-width="1"/><text x="43" y="212.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#31570F" text-anchor="start">Aged Nrf2 cKO</text><text x="43" y="227.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#31570F" text-anchor="start">Knockout restricted to</text><text x="43" y="241.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#31570F" text-anchor="start">oligodendrocytes</text><rect x="320" y="198" width="224" height="48" rx="5" fill="#EDF4E3" stroke="#9CBE74" stroke-width="1"/><text x="333" y="212.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#31570F" text-anchor="start">Phenocopies human</text><text x="333" y="227.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#31570F" text-anchor="start">Same white matter pathology,</text><text x="333" y="241.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#31570F" text-anchor="start">blunted cognitive gain</text><line x1="266" y1="222" x2="314" y2="222" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><rect x="16" y="282" width="538" height="34" rx="5" fill="#E5F4EF" stroke="#86C6AE" stroke-width="1"/><text x="285.0" y="304" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0D5843" text-anchor="middle">NRF2 in oligodendrocytes — a tractable target for cognitive aging</text></svg>