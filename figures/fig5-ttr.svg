<svg xmlns="http://www.w3.org/2000/svg" width="570" height="300" viewBox="0 0 570 300" role="img"><title>Biopsy-derived transthyretin fibril structures</title><desc>Cryo-EM of biopsy tissue from ten living ATTRv patients yielded nineteen fibril structures; deep-learning density analysis assigned mutant versus wild-type composition, which tracked age of disease onset.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="570" height="300" fill="#ffffff"/><text x="16" y="24" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#14171a" text-anchor="start">Amyloid structures from living patients, via biopsy</text><rect x="16" y="44" width="196" height="56" rx="5" fill="#E9F1FA" stroke="#7FA8CE" stroke-width="1"/><text x="29" y="62.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#123C63" text-anchor="start">Ten ATTRv patients</text><text x="29" y="77.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#123C63" text-anchor="start">Nine distinct mutations</text><text x="29" y="91.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#123C63" text-anchor="start">heterozygous carriers</text><rect x="232" y="44" width="150" height="56" rx="5" fill="#E9F1FA" stroke="#7FA8CE" stroke-width="1"/><text x="245" y="62.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#123C63" text-anchor="start">Biopsy tissue</text><text x="245" y="77.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#123C63" text-anchor="start">Muscle and vitreous</text><text x="245" y="91.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#123C63" text-anchor="start">from living donors</text><rect x="402" y="44" width="152" height="56" rx="5" fill="#E9F1FA" stroke="#7FA8CE" stroke-width="1"/><text x="415" y="62.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#123C63" text-anchor="start">Cryo-EM</text><text x="415" y="77.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#123C63" text-anchor="start">19 structures</text><text x="415" y="91.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#123C63" text-anchor="start">at 1.9–3.4 Å</text><line x1="216" y1="72" x2="228" y2="72" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><line x1="386" y1="72" x2="398" y2="72" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><rect x="16" y="116" width="538" height="96" rx="7" fill="none" stroke="#d9dde0" stroke-width="1" stroke-dasharray="4 4"/><text x="29" y="133" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#8a939c" text-anchor="start">DEEP-LEARNING ANALYSIS OF CRYO-EM DENSITY</text><rect x="30" y="136" width="236" height="62" rx="5" fill="#FBF1DF" stroke="#DFBA7C" stroke-width="1"/><text x="43" y="157.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#6E4309" text-anchor="start">Mutant vs wild-type TTR</text><text x="43" y="172.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6E4309" text-anchor="start">Assigned semi-quantitatively</text><text x="43" y="186.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6E4309" text-anchor="start">within individual fibrils</text><rect x="300" y="136" width="244" height="62" rx="5" fill="#FBF1DF" stroke="#DFBA7C" stroke-width="1"/><text x="313" y="157.5" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#6E4309" text-anchor="start">Composition tracks onset age</text><text x="313" y="172.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6E4309" text-anchor="start">Which species nucleates may</text><text x="313" y="186.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6E4309" text-anchor="start">set clinical timing</text><line x1="270" y1="167" x2="294" y2="167" stroke="#9aa3a8" stroke-width="1.2" marker-end="url(#a)"/><rect x="16" y="226" width="538" height="34" rx="5" fill="#E5F4EF" stroke="#86C6AE" stroke-width="1"/><text x="285.0" y="248" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0D5843" text-anchor="middle">Biopsy workflow opens living-patient tissue to amyloid structural biology</text></svg>